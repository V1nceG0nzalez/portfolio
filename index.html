<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vince Gonzalez | Pharmaceutical Media Measurement Expert</title>
  <meta
    name="description"
    content="Vince Gonzalez is a pharmaceutical media measurement expert specializing in omnichannel analytics, measurement frameworks, dashboarding, and ROI-driven media performance."
  />

  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />

  <style>
    :root,
    [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      --color-bg: #f3f4f6;
      --color-surface: #ffffff;
      --color-surface-2: #eef2f7;
      --color-border: rgba(15, 23, 42, 0.12);
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-text-faint: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-strong: #0284c7;
      --color-accent: #7c3aed;
      --color-card-glow: rgba(14, 165, 233, 0.18);

      --radius-sm: 0.5rem;
      --radius-md: 0.85rem;
      --radius-lg: 1.25rem;
      --radius-xl: 1.75rem;
      --radius-full: 999px;

      --shadow-sm: 0 8px 24px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 16px 48px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 24px 80px rgba(15, 23, 42, 0.14);

      --font-display: 'Satoshi', 'Inter', sans-serif;
      --font-body: 'General Sans', 'Inter', sans-serif;

      --content: 1200px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --color-bg: #05070b;
      --color-surface: #0c1118;
      --color-surface-2: #111827;
      --color-border: rgba(148, 163, 184, 0.16);
      --color-text: #f8fafc;
      --color-text-muted: #cbd5e1;
      --color-text-faint: #94a3b8;
      --color-primary: #7dd3fc;
      --color-primary-strong: #38bdf8;
      --color-accent: #a78bfa;
      --color-card-glow: rgba(56, 189, 248, 0.12);

      --shadow-sm: 0 8px 24px rgba(2, 8, 23, 0.35);
      --shadow-md: 0 16px 48px rgba(2, 8, 23, 0.5);
      --shadow-lg: 0 24px 80px rgba(2, 8, 23, 0.65);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.65;
      color: var(--color-text);
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(167, 139, 250, 0.08), transparent 24%),
        linear-gradient(180deg, #04060a 0%, var(--color-bg) 100%);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: auto;
    }

    .skip-link:focus {
      left: var(--space-4);
      top: var(--space-4);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      z-index: 1000;
    }

    .site-shell {
      max-width: var(--content);
      margin: 0 auto;
      padding: var(--space-4);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(5, 7, 11, 0.7);
      border-bottom: 1px solid var(--color-border);
    }

    .topbar-inner {
      max-width: var(--content);
      margin: 0 auto;
      padding: var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 44px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(125, 211, 252, 0.28);
      background:
        linear-gradient(135deg, rgba(125, 211, 252, 0.18), rgba(167, 139, 250, 0.12)),
        var(--color-surface);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
      color: var(--color-primary);
    }

    .brand-copy span {
      display: block;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: var(--text-sm);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-role {
      font-size: var(--text-xs);
      color: var(--color-text-faint);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      align-items: center;
    }

    .nav a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 var(--space-4);
      border-radius: var(--radius-full);
      color: var(--color-text-muted);
      border: 1px solid transparent;
      transition: all var(--transition);
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: var(--color-text);
      border-color: var(--color-border);
      background: rgba(255, 255, 255, 0.03);
    }

    .theme-toggle {
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
    }

    .hero {
      padding: clamp(var(--space-12), 10vw, var(--space-24)) 0 var(--space-12);
      display: grid;
      gap: var(--space-8);
      grid-template-columns: 1.2fr 0.8fr;
      align-items: end;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.45rem 0.8rem;
      border-radius: var(--radius-full);
      border: 1px solid rgba(125, 211, 252, 0.22);
      background: rgba(125, 211, 252, 0.08);
      color: var(--color-primary);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: var(--space-5);
    }

    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      line-height: 0.98;
      letter-spacing: -0.04em;
      max-width: 10ch;
    }

    .hero p {
      color: var(--color-text-muted);
      max-width: 64ch;
      margin-top: var(--space-5);
    }

    .hero-panel {
      background:
        linear-gradient(180deg, rgba(125, 211, 252, 0.08), rgba(255,255,255,0.01)),
        var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: -30% auto auto -10%;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18), transparent 68%);
      pointer-events: none;
    }

    .quote {
      font-size: var(--text-lg);
      font-family: var(--font-display);
      line-height: 1.3;
      margin-bottom: var(--space-6);
    }

    .stats-grid,
    .tools-grid,
    .impact-grid {
      display: grid;
      gap: var(--space-4);
    }

    .stats-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      margin-top: var(--space-8);
    }

    .stat-card,
    .card,
    .timeline-card,
    .case-card,
    .tool-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .stat-card {
      padding: var(--space-5);
      min-height: 150px;
      background:
        linear-gradient(180deg, rgba(125, 211, 252, 0.06), transparent 60%),
        var(--color-surface);
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      line-height: 1;
      margin-bottom: var(--space-3);
      color: var(--color-primary);
    }

    .stat-label {
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }

    .page-section {
      padding: clamp(var(--space-10), 8vw, var(--space-20)) 0;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      scroll-margin-top: 100px;
    }

    .section-header {
      display: grid;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      max-width: 72ch;
    }

    .section-kicker {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-primary);
    }

    .section-header h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .section-header p {
      margin: 0;
      color: var(--color-text-muted);
    }

    .about-layout,
    .career-layout,
    .education-layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: var(--space-6);
      align-items: start;
    }

    .card {
      padding: var(--space-6);
    }

    .lead {
      font-size: var(--text-lg);
      color: var(--color-text);
      max-width: 44ch;
    }

    .list {
      padding-left: 1.1rem;
      color: var(--color-text-muted);
    }

    .list li + li {
      margin-top: var(--space-3);
    }

    .timeline {
      display: grid;
      gap: var(--space-4);
    }

    .timeline-card {
      padding: var(--space-5);
      position: relative;
      overflow: hidden;
    }

    .timeline-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 2px;
      background: linear-gradient(180deg, var(--color-primary), transparent);
    }

    .timeline-year {
      color: var(--color-primary);
      font-size: var(--text-xs);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }

    .timeline-card h3,
    .case-card h3,
    .tool-card h3,
    .card h3 {
      margin: 0 0 var(--space-2);
      font-size: var(--text-lg);
      line-height: 1.2;
    }

    .timeline-card p,
    .case-card p,
    .tool-card p,
    .card p {
      margin: 0;
      color: var(--color-text-muted);
    }

    .case-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-6);
    }

    .case-card {
      padding: var(--space-6);
      background:
        linear-gradient(180deg, rgba(125, 211, 252, 0.05), transparent 40%),
        var(--color-surface);
    }

    .case-meta {
      display: inline-flex;
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-primary);
      margin-bottom: var(--space-3);
    }

    .case-block {
      margin-top: var(--space-5);
      padding-top: var(--space-5);
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .case-block h4 {
      margin: 0 0 var(--space-2);
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
      margin-top: var(--space-5);
    }

    .result-tile {
      padding: var(--space-4);
      border-radius: var(--radius-md);
      background: var(--color-surface-2);
      border: 1px solid rgba(148, 163, 184, 0.12);
      min-height: 120px;
    }

    .result-tile strong {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-xl);
      color: var(--color-primary);
      line-height: 1;
      margin-bottom: var(--space-2);
    }

    .impact-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .tool-card {
      padding: var(--space-5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 110px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background:
        linear-gradient(180deg, rgba(167, 139, 250, 0.05), transparent 45%),
        var(--color-surface);
    }

    .tools-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .edu-stack {
      display: grid;
      gap: var(--space-4);
    }

    .signature-card {
      padding: var(--space-6);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(125, 211, 252, 0.2);
      background:
        linear-gradient(180deg, rgba(125, 211, 252, 0.08), rgba(255,255,255,0.01)),
        var(--color-surface);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02), var(--shadow-md);
    }

    .signature-card blockquote {
      margin: 0 0 var(--space-5);
      font-size: var(--text-lg);
      color: var(--color-text);
      max-width: 28ch;
    }

    .signature {
      color: var(--color-text-faint);
      font-family: var(--font-display);
      letter-spacing: 0.04em;
    }

    .journey-image {
      margin-top: var(--space-5);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6);
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .journey-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    .contact-links a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.15rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text);
      font-weight: 600;
      transition: all var(--transition);
    }

    .contact-links a:hover,
    .contact-links a:focus-visible {
      border-color: rgba(125, 211, 252, 0.35);
      color: var(--color-primary);
      transform: translateY(-1px);
    }

    .contact-form {
      display: grid;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }

    .form-note {
      margin: 0 0 var(--space-2);
      color: var(--color-text-faint);
      font-size: var(--text-sm);
    }

    .contact-form label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text);
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text);
      border-radius: var(--radius-md);
      padding: 0.95rem 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--color-primary-strong);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
    }

    .contact-form textarea {
      resize: vertical;
      min-height: 140px;
    }

    .contact-form button {
      min-height: 48px;
      margin-top: var(--space-2);
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-primary-strong), var(--color-accent));
      color: white;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
    }

    .contact-form button:hover,
    .contact-form button:focus-visible {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      filter: saturate(1.05);
    }

    footer {
      padding: var(--space-10) 0 var(--space-12);
      color: var(--color-text-faint);
      font-size: var(--text-sm);
    }

    @media (max-width: 1100px) {
      .stats-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tools-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .hero,
      .about-layout,
      .career-layout,
      .education-layout,
      .case-grid,
      .impact-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid,
      .result-grid,
      .tools-grid {
        grid-template-columns: 1fr 1fr;
